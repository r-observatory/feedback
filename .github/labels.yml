# The taxonomy. This file is the source for every label create and update.
# It is not a mirror: a label added or renamed in the GitHub UI is invisible
# here and survives every sync, so make label changes in this file.
#
# Prefixes: t: type, a: area, p: priority, s: status, c: community.

# Type: what kind of report this is. Set by the issue form.
- name: "t:bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "t:data-issue"
  color: "e99695"
  description: "Data is wrong, missing, or stale"
- name: "t:feature-request"
  color: "a2eeef"
  description: "New feature suggestion"
- name: "t:data-source"
  color: "c2e0c6"
  description: "New data source to track"
- name: "t:documentation"
  color: "0075ca"
  description: "Documentation related"
- name: "t:question"
  color: "cc317c"
  description: "Question from the community"

# Area: the domain, not the repo. Several domains are served by more than one
# repo. Set by hand at triage, one per issue.
- name: "a:site"
  color: "bfd4f2"
  description: "Site chrome, navigation, search, performance"
- name: "a:package-page"
  color: "bfd4f2"
  description: "The per-package detail page"
- name: "a:downloads"
  color: "bfd4f2"
  description: "Download counts and trends"
- name: "a:metadata"
  color: "bfd4f2"
  description: "Package metadata"
- name: "a:code-metrics"
  color: "bfd4f2"
  description: "Code and quality metrics"
- name: "a:coverage"
  color: "bfd4f2"
  description: "Test coverage"
- name: "a:datasets"
  color: "bfd4f2"
  description: "Dataset metadata"
- name: "a:archive"
  color: "bfd4f2"
  description: "Archived packages"
- name: "a:queue"
  color: "bfd4f2"
  description: "CRAN incoming queue"
- name: "a:feed"
  color: "bfd4f2"
  description: "Package change feed"
- name: "a:vcs-signals"
  color: "bfd4f2"
  description: "Repository social signals"
- name: "a:api"
  color: "bfd4f2"
  description: "Raw data and database downloads"
- name: "a:infra"
  color: "bfd4f2"
  description: "Pipelines, CI, the daily merge, and publishing. Use for staleness"

# Priority. Set by hand at triage.
- name: "p:high"
  color: "b60205"
  description: "High priority"
- name: "p:medium"
  color: "fbca04"
  description: "Medium priority"
- name: "p:low"
  color: "0e8a16"
  description: "Low priority"

# Status. s:needs-triage is set by the issue form; the rest by hand.
- name: "s:needs-triage"
  color: "fbca04"
  description: "Awaiting triage"
- name: "s:needs-info"
  color: "d4c5f9"
  description: "More info needed from reporter"
- name: "s:in-progress"
  color: "0e8a16"
  description: "Being worked on"
- name: "s:blocked"
  color: "b60205"
  description: "Blocked by something else"
- name: "s:upstream"
  color: "e4e669"
  description: "Cause or fix lives upstream, not in R Observatory"
- name: "s:duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"
- name: "s:wontfix"
  color: "cfd3d7"
  description: "Will not be addressed"
- name: "s:invalid"
  color: "cfd3d7"
  description: "Not a real issue, spam, or off topic"

# Community.
- name: "c:good-first-issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "c:help-wanted"
  color: "008672"
  description: "Help is wanted"
