name: Feature request
description: "Suggest a new page, chart, metric, filter, or export."
title: "[FEATURE] "
labels: ["t:feature-request", "s:needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What is the feature?
      description: A clear description of what you would like to see.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What problem does it solve?
      description: Why is this useful, and who benefits?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: Proposed approach
      description: If you have ideas about how it could work.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to achieve the same goal.
    validations:
      required: false
